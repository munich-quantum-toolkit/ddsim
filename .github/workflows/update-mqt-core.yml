name: Update MQT Core
on:
  schedule:
    # run once a month on the first day of the month at 00:00 UTC
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      update-to-head:
        description: "Update to the latest commit on the default branch"
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - .github/workflows/update-mqt-core.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-mqt-core:
    name: ⬆️ Update MQT Core
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-mqt-core-update.yml@063c90c8e7e094bfffb73f8436eb55341c1e820f # v2.3.0
    with:
      update-to-head: ${{ github.event.inputs.update-to-head == 'true' }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    permissions:
      contents: write # Needed to push the update branch
      pull-requests: write # Needed to open the update pull request
