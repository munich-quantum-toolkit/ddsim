name: Update MQT Core
on:
  schedule:
    # run once a month on the first day of the month at 00:00 UTC
    - cron: "0 0 1 * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/update-mqt-core.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-mqt-core:
    if: false
    name: ⬆️ Update MQT Core
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-mqt-core-update.yml@17f5c58e46c51027501e7d8d38dc182654ed035c # v2.5.0
    with:
      max-major-version: "3"
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    permissions:
      contents: write # Needed to push the update branch
      pull-requests: write # Needed to open the update pull request
